<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
    canvas{display:block;width:100%;height:100%}
  </style>
  <script type="importmap">
  {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const query = new URLSearchParams(location.search);
const width = Number(query.get('w') || 1600);
const height = Number(query.get('h') || 900);
const mode = query.get('mode') || 'desktop';
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setSize(width,height,false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const fade=document.createElement('div');fade.style.cssText='position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none';document.body.appendChild(fade);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd6a486);
scene.fog = new THREE.FogExp2(0x3b3540,0.013);
const camera = new THREE.PerspectiveCamera(28,width/height,0.05,240);
camera.up.set(0,0,1);

const hemi = new THREE.HemisphereLight(0xffdfc5,0x1a2735,2.3);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffb978,5.0);
key.position.set(-12,-18,20);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-22; key.shadow.camera.right=22; key.shadow.camera.top=24; key.shadow.camera.bottom=-24;
key.shadow.camera.near=.1; key.shadow.camera.far=80; key.shadow.bias=-0.00015;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6daeff,3.0);
rim.position.set(18,8,10); scene.add(rim);

const env = new THREE.Group();
scene.add(env);
const asphaltMat = new THREE.MeshStandardMaterial({color:0x1d2025,roughness:.76,metalness:.08});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,130),asphaltMat);
ground.receiveShadow=true; ground.position.set(0,13,-1.01); env.add(ground);

function box(name,size,pos,material,cast=true,receive=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),material); mesh.name=name; mesh.position.set(...pos); mesh.castShadow=cast; mesh.receiveShadow=receive; env.add(mesh); return mesh;
}
const warehouseMat=new THREE.MeshStandardMaterial({color:0x25262a,roughness:.58,metalness:.25});
const dockMat=new THREE.MeshStandardMaterial({color:0x0c0e12,roughness:.45,metalness:.28});
box('warehouse',[7,92,7],[14,13,2.5],warehouseMat);
for(let y=-28;y<52;y+=9){
  box('dock',[.18,5.4,3.9],[10.42,y,1.0],dockMat);
  box('canopy',[1.2,5.7,.20],[9.9,y,3.25],warehouseMat);
  const lamp=box('dock-light',[.22,.75,.2],[9.28,y,3.58],new THREE.MeshStandardMaterial({color:0xffd2a2,emissive:0xff8a35,emissiveIntensity:5,roughness:.18}),false,false);
}
const trailerMat=new THREE.MeshStandardMaterial({color:0x77777b,roughness:.42,metalness:.45});
for(const y of [-20,8,35]) box('trailer',[7.5,2.8,3.6],[6.1,y,.8],trailerMat);
const stripeMat=new THREE.MeshBasicMaterial({color:0xe1c06d});
for(let y=-42;y<67;y+=7.4) box('lane',[.10,3.5,.022],[-1.35,y,-.88],stripeMat,false,false);
for(const y of [-26,-6,15,38]) box('barrier',[1.2,2.5,.52],[-7.0,y,-.73],new THREE.MeshStandardMaterial({color:0x55575a,roughness:.7}),true,true);

const digital = new THREE.Group();
scene.add(digital);
const gridMat=new THREE.MeshBasicMaterial({color:0x20bfff,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});
for(let x=-8;x<=9;x+=1.5) boxDigital([.025,84,.025],[x,12,-.86]);
for(let y=-28;y<=55;y+=4) boxDigital([18,.025,.025],[.5,y,-.85]);
function boxDigital(size,pos){ const m=new THREE.Mesh(new THREE.BoxGeometry(...size),gridMat.clone());m.position.set(...pos);digital.add(m);return m; }

const sky = new THREE.Mesh(new THREE.SphereGeometry(120,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,uniforms:{top:{value:new THREE.Color(0x33394d)},bottom:{value:new THREE.Color(0xeab080)},dark:{value:0}},
  vertexShader:'varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vPos;uniform vec3 top;uniform vec3 bottom;uniform float dark;void main(){float h=smoothstep(-.2,.7,normalize(vPos).z);vec3 c=mix(bottom,top,h);c=mix(c,vec3(.005,.012,.024),dark);gl_FragColor=vec4(c,1.);}'
}));
scene.add(sky);

const vehicleStage = new THREE.Group();
scene.add(vehicleStage);
let vehicle,wire,mixer;
const clock=new THREE.Clock();

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function smooth(v){v=clamp(v);return v*v*(3-2*v)}
function smoother(v){v=clamp(v);return v*v*v*(v*(v*6-15)+10)}
function seg(f,a,b){return clamp((f-a)/(b-a))}
function lerp(a,b,t){return a+(b-a)*t}
function keyframe(f,keys){
  if(f<=keys[0][0])return keys[0][1]; if(f>=keys.at(-1)[0])return keys.at(-1)[1];
  for(let i=0;i<keys.length-1;i++){const [a,av]=keys[i],[b,bv]=keys[i+1];if(f>=a&&f<=b){const t=smoother((f-a)/(b-a));return Array.isArray(av)?av.map((v,j)=>lerp(v,bv[j],t)):lerp(av,bv,t)}}
}

function setFrame(f){
  if(!vehicle)return;
  const travel=keyframe(f,[[0,-9],[26,-4],[58,3.5],[88,10.5],[108,15],[120,17.2],[129,17.8]]);
  const yaw=THREE.MathUtils.degToRad(keyframe(f,[[0,0],[103,0],[120,-1.2],[129,-2.2]]));
  vehicleStage.position.set(0,travel,0); vehicleStage.rotation.z=yaw;
  const bounce=Math.sin(f*.30)*.012*(1-smooth(seg(f,108,129)));
  vehicleStage.position.z=bounce;
  if(mixer)mixer.setTime((f/129)*4);
  wire.visible=false;
  vehicle.traverse(o=>{if(o.material){o.material.transparent=o.userData.wasTransparent;o.material.opacity=o.userData.baseOpacity??1}});
  digital.children.forEach(o=>o.material.opacity=0);
  const industrial=smoother(seg(f,18,48));
  env.children.forEach(o=>{if(o!==ground)o.visible=industrial>.005});
  ground.material.color.setRGB(lerp(.08,.115,industrial),lerp(.085,.125,industrial),lerp(.095,.145,industrial));

  let c,l,fov;
  if(mode==='mobile'){
    const dist=keyframe(f,[[0,-9.7],[55,-9.2],[96,-8.8],[129,-8.6]]);c=[dist,travel+.05,keyframe(f,[[0,2.1],[90,1.82],[129,1.72]])];l=[0,travel,.88];fov=keyframe(f,[[0,49],[70,47],[108,46],[129,45]]);
  }else{
    const dist=keyframe(f,[[0,-15.2],[55,-14.2],[96,-13.3],[129,-12.9]]);c=[dist,travel+.05,keyframe(f,[[0,1.82],[90,1.54],[129,1.50]])];l=[0,travel,.88];fov=keyframe(f,[[0,28.5],[62,27],[108,26],[129,25.5]]);
  }
  camera.position.set(...c); camera.lookAt(new THREE.Vector3(...l)); camera.fov=fov; camera.updateProjectionMatrix();
  const white=smoother(seg(f,116,129));
  renderer.toneMappingExposure=1.06;
  fade.style.opacity=String(white);
  renderer.render(scene,camera);
}

new GLTFLoader().load('./model/Canby-Community-Clinic-Type-I-Ambulance-4K.glb',gltf=>{
  vehicle=gltf.scene;
  const box=new THREE.Box3().setFromObject(vehicle),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);
  const long=Math.max(size.x,size.y);const scale=8.4/long;vehicle.scale.setScalar(scale);vehicle.updateMatrixWorld(true);
  const scaledBox=new THREE.Box3().setFromObject(vehicle);scaledBox.getCenter(center);
  vehicle.position.x-=center.x;vehicle.position.y-=center.y;vehicle.position.z-=scaledBox.min.z+1.0;
  if(size.x>size.y)vehicle.rotation.z=Math.PI/2;
  vehicle.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material=o.material.clone();o.userData.baseOpacity=o.material.opacity;o.userData.wasTransparent=o.material.transparent;o.material.envMapIntensity=1.2}}});
  vehicleStage.add(vehicle);
  wire=vehicle.clone(true);
  wire.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshBasicMaterial({color:0x26c6ff,wireframe:true,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});o.castShadow=false}});
  wire.visible=false;vehicleStage.add(wire);
  if(gltf.animations.length){mixer=new THREE.AnimationMixer(vehicle);mixer.clipAction(gltf.animations[0]).play()}
  window.setAnimationFrame=(f)=>{setFrame(Number(f));return true};
  setFrame(0);window.__READY=true;
},undefined,e=>{window.__ERROR=String(e);console.error(e)});
</script>
</body>
</html>
