<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canby Clinic Ambulance Scroll Intro</title>
  <meta name="description" content="Terminal-style scroll controlled ambulance opening concept for Canby Clinic." />
  <link rel="preload" as="image" href="assets/frames/canby_ambulance_frame_001.jpg" />
  <link rel="stylesheet" href="assets/css/ambulance-hero.css" />
</head>
<body>
  <header class="glass-nav" aria-label="Opening navigation">
    <div class="brand">
      <span class="brand-mark">+</span>
      <span>Canby Clinic</span>
    </div>
    <nav>
      <a href="#hero">Opening</a>
      <a href="tel:+18186744414">Call</a>
      <a href="https://maps.google.com/?q=7601%20Canby%20Ave%20%236B%2C%20Reseda%2C%20CA%2091335">Directions</a>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero-sequence" aria-label="Canby Clinic ambulance scroll animation">
      <div class="sticky-stage">
        <canvas id="heroCanvas" aria-hidden="true"></canvas>
        <div class="loading" id="loading">Loading cinematic ambulance sequence…</div>
        <div class="scanline"></div>
        <div class="scroll-hint" id="scrollHint">
          <span></span>
          Scroll
        </div>
        <div class="scene-copy" id="sceneCopy">
          <p class="eyebrow" id="eyebrow">CANBY CLINIC MOBILE CARE UNIT</p>
          <h1 id="headline">Community care is on the move.</h1>
          <p class="subline" id="subline">A cinematic homepage direction for Canby Clinic.</p>
        </div>
      </div>
    </section>
    <section class="end-card" aria-label="Animation handoff">
      <div>
        <p class="eyebrow">INTRO PROTOTYPE READY</p>
        <h2>Approve the ambulance motion, then we build the full site around it.</h2>
      </div>
    </section>
  </main>

  <script src="assets/js/ambulance-hero.js"></script>
</body>
</html>
